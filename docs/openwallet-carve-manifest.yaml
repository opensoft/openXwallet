# docs/openwallet-carve-manifest.yaml — the CARVE MANIFEST for the openWallet
# split (`split-openwallet-neutral-core`, `design.md` D7 "The carve manifest",
# `tasks.md` 2.5). It is the DECLARED PATH MAPPING that part one (a) of D7's
# proof reads: every path this repository tracks at the carve commit, the one
# place it goes (or that it stays), and the bytes it carries when it goes.
#
# WHICH RULING NAMED THE CARVE COMMIT. Brett Heap, operator authority, in
# session, 2026-10-08T18:07:19Z, verbatim: "name 90111df as the carve commit,
# do 2.4 and 2.5" (opensoft/openXwallet#25, comment 6066081858). `carve_commit:`
# below is that commit in full — `main` at the merge of PR #28, after tasks 2.1
# (the archive of `add-multi-key-wallets`) and 2.2 (the reflow). NEVER HEAD: the
# carve runs from a fresh clone AT this commit (D7 "Creation route" step 3), so
# a file that changes on `main` afterwards is not what the carve ships.
#
# WHAT IT DECLARES, AND WHAT REFUSES. One row per tracked path at the carve
# commit — 232, measured with `git ls-tree -r --name-only` — and no other row.
# A tracked path in no row, or in two rows, REFUSES; so does a row for a path
# the carve commit does not carry. Every MOVED row's `destination_path` equals
# its `source_path` (D7: within each leg a carved path keeps its
# repository-relative path, which is what keeps the carve a pure copy per leg
# and every digest whole). A file CREATED at a destination — the scaffold's
# seeds, the corpus binding (Q6), each leg's `LICENSE` — gets no row: this
# manifest declares what LEAVES, not what a destination assembles (openDox's
# rule, kept).
#
# HOW TO VERIFY IT. From any checkout that carries the carve commit in its
# history:
#
#     python3 scripts/validate-carve-manifest.py
#     python3 scripts/validate-carve-manifest.py --at 90111df262d6f54f7e82651d860adc12345f83f4
#
# The checker recomputes every moved row's sha256 from the raw git blob at the
# carve commit, walks the whole tree there for completeness, and asks of the
# revision under test whether anything under the carve SURFACE (`moved_paths:`
# below) has changed, vanished or appeared since. In CI it runs in
# `.github/workflows/carve-manifest.yml` (job `carve-manifest`) at
# `fetch-depth: 0`, beside `tests/carve_manifest/test_carve_manifest.py`. A
# depth-1 checkout (the default `actions/checkout`, which `pytest-suite.yml`
# uses, and which is a carved row and so not edited) does not carry the carve
# commit: the checker REFUSES there (`carve-revision-mismatch`) rather than
# pass on a history it cannot read, and the test's real-repository seat SKIPS
# LOUDLY there, naming the commit and that workflow.
#
# THE GRAMMAR IS openDox's (openxFactory `docs/opendox-carve-manifest.yaml`,
# checked by its `scripts/validate-carve-manifest.py`), with these differences,
# each one D7's:
#
#   * THE COMPLETENESS SURFACE IS THE WHOLE TREE at the carve commit, not the
#     `moved_paths:` prefixes. openDox declared what left one large repository;
#     D7 asks for "one row per tracked path". `moved_paths:` is still declared:
#     it is the SURFACE watched at the revision under test, so a file that
#     appears there after the carve commit refuses, while `main` growing a file
#     the carve does not touch (this manifest, its checker, its test) does not.
#     Every moved row must lie inside it.
#   * `retained_here:` on every row — `kept`, `shed` or `retired_by_archive`.
#     The adapter rebuild sheds EXACTLY the `shed` rows (`tasks.md` 5.5); the
#     two promoted specs leave ONLY by this change's archive
#     (`retired_by_archive`); every other row stays, the `not_moved` rows all
#     among them.
#   * THE LEG-CLASSIFICATION OVERRIDES ARE DECLARED, NOT IMPLIED. Every moved
#     row records `leg_default:` — the leg and the rule openRepoShape's
#     classifier gives that path (`leg_classification:` below names the policy
#     at its commit and digest) — and a row whose destination leg departs from
#     that default names, in `leg_override:`, the entry of `leg_overrides:` that
#     carries the rule it overrides and the authority for it. A departing row
#     with no override, or an override on a row that does not depart, refuses.
#   * THE EDIT CLASSES ARE D7's FIVE, CLOSED: the validator's hunks (a)-(e),
#     the test split, the manifest field edits, the subject lines (the eleven
#     plus the travelling change's three occurrences), and the code-leg
#     workflow's envelope-verify step. `edits:` carries `{class, lines[],
#     note}` with the line numbers AT THE CARVE COMMIT, so a
#     `moved_with_declared_edit` row is falsifiable at the destination (part
#     two (b) of the proof) rather than a label.
#   * A `not_moved` row carries `reason` and `evidence` and no digest, as in
#     openDox: a digest is the claim that bytes arrive somewhere. The reason
#     vocabulary is this repository's, closed in the checker.
#
# THE COUNTS, as the checker reports them at the carve commit: 232 rows — 120
# `moved_verbatim`, 8 `moved_with_declared_edit`, 104 `not_moved`; 80 to
# `openwallet_code`, 38 to `openwallet_spec`, 10 to `openwallet_root`;
# `retained_here` 124 `kept`, 106 `shed`, 2 `retired_by_archive`; 82 leg
# overrides — 73 under RULED Q7 and 9 PROPOSED — exactly D7's two groups; 1,884
# declared edit lines over the 8 edited rows.
#
# THIS IS THE FIRST MACHINE-VALIDATED YAML UNDER `docs/` IN THIS REPOSITORY,
# and that is a deliberate break with the convention, made by the ruled path.
# Measured at the carve commit: `git ls-tree -r --name-only` under `docs/`
# lists four Markdown files and no YAML. The path is the packet's
# (`design.md` D7, `tasks.md` 2.5, `proposal.md` Q7), ratified with it on
# 2026-10-08, and the ruling above names it again. The wallet validator reads
# the file as another kind (`kind: openwallet-carve-manifest` is no
# `xfactory_wallet_*` kind), and the syntax gate parses it only if its text
# carries a wallet kind string.
#
# RE-CUTTING. If `main` moves under the surface before the carve runs, this
# file is re-cut at a NEW carve commit — which is a new ruling — and every
# digest is RECOMPUTED, never carried forward.

schema_version: 1
kind: openwallet-carve-manifest

# WHICH SIDE OF THE SHED THIS REPOSITORY IS ON — openDox's vocabulary, closed
# at two values. `carve` (what an absent key means): every row's source path is
# still here, and every MOVED row's blob must still be its carve-commit blob.
# `post-shed`: the adapter rebuild (`tasks.md` 5.5) has removed exactly the
# `retained_here: shed` rows, which must then be ABSENT; a `kept` row is still
# required present; a `retired_by_archive` row may be present (unchanged) or
# gone, because it leaves by this change's archive, a later act. The flip and
# the shed land in ONE commit, or the checker refuses.
phase: carve

header: >-
  The openWallet carve manifest: one row per tracked path at the NAMED CARVE
  COMMIT below (Brett Heap, 2026-10-08, "name 90111df as the carve commit, do
  2.4 and 2.5"), in openDox's grammar plus `retained_here`, the declared
  leg-classification overrides and design.md D7's five edit classes. The
  referent is the 40-hex `carve_commit:`; read the comment block at the top of
  this file for the differences from openDox's grammar.

carve_commit: "90111df262d6f54f7e82651d860adc12345f83f4"
source_repository: opensoft/openXwallet
digest_algorithm: sha256
digest_source: raw_git_blob
path_order: bytewise_utf8

# CLOSED. A row's `destination` is a KEY here. `leg:` is openRepoShape's
# (`code`, `spec`, `assembly`); the root is the assembly leg.
destinations:
  openwallet_code: {repository: opensoft/openWallet-code, leg: code}
  openwallet_root: {repository: opensoft/openWallet, leg: assembly}
  openwallet_spec: {repository: opensoft/openWallet-spec, leg: spec}

# design.md D7 "The edit classes are closed", in its order. Asserted EQUAL to
# the checker's own list, so a manifest cannot declare itself a sixth.
edit_classes:
  - validator hunks (a)-(e)
  - test split
  - manifest field edits
  - subject lines
  - envelope-verify step

# The reasons this manifest uses, a subset of the checker's closed set.
not_moved_reasons:
  - stays_openxwallet_adapter
  - stays_openxwallet_front_door
  - stays_openxwallet_governance
  - stays_vendored_not_carved

# WHERE EACH `leg_default:` CAME FROM. openRepoShape's classifier
# (`PathPolicy.classify_file`, per file and unfolded) was run over the 232
# tracked paths at the carve commit, against the policy below at its commit,
# whose bytes hash to `policy_sha256`. THE POLICY PROPOSES; A HUMAN DISPOSES:
# where a row departs, `leg_override:` says who disposed and on what authority.
# Of the 128 moved rows, exactly 82 depart, all from `spec-governance`.
leg_classification:
  policy_repository: opensoft/openRepoShape
  policy_path: contracts/path-classification.yaml
  classifier: scripts/path_classify.py
  policy_commit: "7f84ca42ca86a8902928345109d2bf6bad87bd91"
  policy_sha256: "068adaaccd12df028490ea1e0ca32910e3fbd3f7e1def1c3fd92dfdead276b15"

# THE TWO DECLARED OVERRIDES of the classifier's default (design.md D7 "The
# leg-classification overrides are DECLARED, not implied"). A row names one by
# key; the entry's `leg` must be the row's destination leg and its
# `overrides_rule` the row's `leg_default.rule`.
leg_overrides:
  q7-code-leg:
    status: ruled
    overrides_rule: spec-governance
    leg: code
    authority: >-
      RULED Q7, "Code leg, declared override (Recommended)" — Brett Heap, in
      session, by multiple choice, recorded 2026-10-08T17:01:43Z
      (split-openwallet-neutral-core proposal.md Q7 and .openspec.yaml
      origin.rulings). Contracts, corpus and validator stay together in
      opensoft/openWallet-code at today's repository-relative paths. Governs
      the 73 rows of contracts/openxwallet/ and contracts/openxwallet-agent-profile/
      less the three grant-review-* negatives.
  d7-root-release-identity:
    status: proposed
    overrides_rule: spec-governance
    leg: assembly
    authority: >-
      PROPOSED in design.md D7 ("Release identity at the root"), following
      openDox's root release placement and RULED Q4's series ("openWallet
      continues wallet-v* (Recommended)"); NOT covered by Q7's ruling. Governs
      the 9 release-identity rows — contracts/manifest.yaml,
      contracts/CHANGELOG.md, the six contracts/releases/ records and
      docs/byte-identity-wallet-v1.0.md.

# THE CARVE SURFACE watched at the revision under test: every moved row lies
# under one of these, a file that APPEARS under one after the carve commit
# refuses, and a row under one whose path VANISHES refuses (under `post-shed`,
# except the shed rows and an archived spec). Directory prefixes end in `/`;
# the rest are exact paths in directories that also hold files that stay.
moved_paths:
  - .github/workflows/pytest-suite.yml
  - .github/workflows/wallet-validation.yml
  - LICENSE
  - contracts/CHANGELOG.md
  - contracts/manifest.yaml
  - contracts/openxwallet-agent-profile/
  - contracts/openxwallet/
  - contracts/releases/
  - docs/byte-identity-wallet-v1.0.md
  - openspec/changes/add-composition-drift-cascade/
  - openspec/changes/archive/2026-08-08-add-openxwallet/
  - openspec/changes/archive/2026-10-08-add-multi-key-wallets/
  - openspec/config.yaml
  - openspec/specs/openxwallet-agent-profile/
  - openspec/specs/openxwallet/
  - scripts/validate-openxwallet.py
  - scripts/wallet-yaml-syntax-gate.py
  - specs/006-openxwallet-contracts/
  - specs/010-wallet-validator-ci/
  - specs/015-multi-key-wallets/
  - tests/multi_key_wallets/
  - tests/nested_repo_prune/
  - tests/wallet_yaml_syntax_gate/

