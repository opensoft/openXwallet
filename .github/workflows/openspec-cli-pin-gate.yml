# VENDORED from opensoft/openxFactory@44d8fbaf7d977668973dcd116040c9405416c2ea (#754).
# Byte-identical to that repository's `.github/workflows/openspec-cli-pin-gate.yml`
# below this header EXCEPT for ONE DECLARED DIVERGENCE: the final `run:` line, which
# passes `--tarball tools/openspec-cli-pin/…` at the artifact vendored into this
# repository instead of letting the verifier fetch it from the registry. It exists on
# Brett Heap's ruling of 2026-09-07, by multiple choice, label verbatim "Vendor the
# tarball into the repo", taken for this repository's AGENTS.md rule 4. NOTHING ELSE
# here may be edited. Drift check — the exact commands, and the one hunk they are
# expected to print — and re-vendoring: docs/openspec-cli-pin.md.
# The prose below is openxFactory's, kept verbatim so drift is a `diff`; its
# reference to `tests/openspec_cli_pin/` names tests that live THERE, not here.
# The OpenSpec CLI CONSUMER gate: openxFactory consumes `@fission-ai/openspec` at
# a content address, and this gate fetches the real published artifact, verifies
# it against `contracts/openspec-cli-pin.yaml`, and then runs
# `openspec validate --all --strict` THROUGH the verified binary.
#
# THIS IS THE FIRST REPOSITORY IN THE ESTATE WHOSE ARCHIVE GATE ACTUALLY RUNS IN
# CI, and that is the change rather than a side effect of it. Before this file,
# `openspec validate --all --strict` — the check a delta must pass before it may
# archive — ran in NO repository's continuous integration. This repository's
# `pytest-suite.yml` installs the CLI, but only so `tests/proposal-support/` can
# drive the binary; it never validates the corpus. OpsxFactory and codexFactory
# have no workflow that mentions OpenSpec at all, and MedxFactory, LedgerxFactory
# and AdxFactory have no workflows at all. The gate every engineer believed was
# running was running on their own laptop, at whatever version was installed
# there.
#
# SIBLING OF `openreposhape-pin-gate.yml`, AND IT DIFFERS IN EXACTLY ONE WAY that
# is a fact about the product rather than a shortcut. The openRepoShape gate
# resolves a git tree at a commit and CHECKS it; this product is not distributed
# as a git tree but as a published npm artifact, so the verifier resolves the
# artifact through `npm pack`, recomputes its SHA-512 and SHA-1, and refuses
# before installing anything. There is no `actions/checkout` of the product and
# no submodule: there is nothing to mount, and the referent is the tarball.
#
# NOT A REQUIRED CHECK, and saying so is part of the change rather than an
# omission from it. Making a check REQUIRED is an operator act on an organisation
# ruleset; this workflow reports on pull requests from the moment it lands, and an
# operator may then select the `openspec-cli-pin` token — a check is not
# selectable until a workflow has reported under it once, which is why the
# reporting has to come first.
#
# THE VERSION IS NOT WRITTEN IN THIS FILE, and that absence is deliberate. The
# verifier reads `contracts/openspec-cli-pin.yaml` with its own parser, so there
# is exactly one place the referent is written. A workflow that installed
# `@fission-ai/openspec@1.2.0` by literal would be a second copy of the pin, and
# the whole defect this capability exists to write down is what happens to copies
# of a pin that move separately.
# `tests/openspec_cli_pin/test_openspec_cli_pin.py::
# test_the_gate_workflow_reads_the_pin_and_carries_no_fourth_copy` asserts the
# absence against this file's own bytes, so a helpful future edit that pastes the
# version back in fails on the developer's machine first.
#
# THAT WAS NOT HYPOTHETICAL, AND THIS COMMENT SAID SO IN THE PRESENT TENSE until
# 2026-09-05 — it read "which is precisely what `pytest-suite.yml` does today".
# It did, and by then the two copies HAD moved apart: the pin bumped to `1.12.0`
# while that literal still installed `1.2.0`, so the required test suite drove
# one version while this gate verified another. #667 task 5.1 / #677 task 6.2
# replaced the literal with `scripts/install-pinned-openspec-cli.py`, which
# resolves the binary through this same verifier's code and is asserted by the
# twin of the test above. The claim is corrected rather than deleted: the defect
# is the argument for the absence, and it happened here.
name: openspec-cli-pin-gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: openspec-cli-pin-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openspec-cli-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node is here to supply `npm`, and for NOTHING else. The version the gate
      # runs is not this one: it is the artifact the verifier fetches and checks.
      # `@fission-ai/openspec@1.12.0` declares `engines.node >=20.19.0`, which 22
      # satisfies (`1.2.0` declared the same floor).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `pip install`. The verifier is standard-library only, deliberately, on
      # the sibling gate's reasoning: a pin verifier that needed a package
      # installed before it could check which package is installed would be
      # carrying the assumption it exists to refuse.
      #
      # `--no-cache` because a runner is a fresh machine and a cache directory it
      # would build and throw away is a directory whose reuse nothing ever tests.
      # The artifact is fetched and hashed here on every run, which is the whole
      # point of a gate.
      #
      # THE INVOCATION IS LITERAL AND IT IS PINNED BY A TEST. `--all` is the scan
      # target; `neutral-product-pin` requires that a pinned validator invoked
      # with NO scan target refuse rather than self-test, and requires the literal
      # invocation to be pinned in the consuming repository so that a silent
      # repoint to a target that reads nothing is impossible.
      # ---- openXwallet DIVERGENCE, declared in the header at the top of this file.
      # Brett Heap, 2026-09-07, by multiple choice, label verbatim: "Vendor the
      # tarball into the repo". AGENTS.md rule 4 here says every gate is offline, and
      # openxFactory's line fetches the artifact from registry.npmjs.org on every run.
      # `--tarball` is the VERIFIER'S OWN FLAG for an already-downloaded artifact and
      # it checks the SAME content address either way: `verify_artifact()` recomputes
      # the SHA-512 and the SHA-1 from contracts/openspec-cli-pin.yaml over these
      # exact bytes and refuses BEFORE installing. Vendoring buys offline resolution
      # of the artifact and gives up no verification. The file name carries the pinned
      # SHA-1, so a bump cannot silently reuse the path. `--no-cache` is kept because
      # the `--tarball` path never reads the install cache and the flag says so.
      #
      # WHAT THIS DOES NOT MAKE OFFLINE — measured, not assumed. The verifier installs
      # the verified tarball with `npm install`, and `@fission-ai/openspec@1.12.0`
      # declares TEN runtime dependencies at caret ranges which npm resolves from the
      # registry. On a cold npm cache with no network the step still refuses:
      #   REFUSE pin-unresolvable: installing the verified artifact into … failed
      #   (exit 1, executable absent): npm error code EAI_AGAIN … request to
      #   https://registry.npmjs.org/@inquirer%2fcore failed
      # The ARTIFACT is vendored; its DEPENDENCY CLOSURE is not, and no flag on the
      # vendored installer can be pointed at one. docs/openspec-cli-pin.md
      # § "Rule 4 after the vendoring" records the residual and names the openxFactory
      # follow-on that would close it.
      - name: Verify the OpenSpec CLI pin and validate the corpus at it
        run: python3 scripts/validate-openspec-cli-pin.py --all --no-cache --tarball tools/openspec-cli-pin/fission-ai-openspec-1.12.0-c844543999f673cdd72445879b86a4abea4c07ef.tgz
