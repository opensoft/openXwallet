# The openWallet carve manifest's own check, for every pull request to main
# (`split-openwallet-neutral-core` task 2.5; `design.md` D7 "The carve
# manifest").
#
# WHY THIS FILE EXISTS. `scripts/validate-carve-manifest.py` recomputes every
# moved row's sha256 from the RAW GIT BLOB at the NAMED CARVE COMMIT
# (`90111df262d6f54f7e82651d860adc12345f83f4`), walks that commit's whole tree
# for completeness, and asks whether anything under the carve surface has
# changed, vanished or appeared since — so it needs the carve commit IN THE
# CHECKOUT'S HISTORY. `pytest-suite.yml` checks out at depth 1, which does not
# carry it. `pytest-suite.yml` is itself a carved row of the manifest (moved to
# the code leg, kept here): before the shed an edit to it refused as a file
# CHANGED SINCE THE CARVE, so this NEW workflow — a path the carve does not
# touch — was written to run the checker and its test with `fetch-depth: 0`
# instead. Under the manifest's `phase: post-shed` a kept moved row's bytes are
# no longer compared with the carve commit, only its path required present, so
# the adapter rebuild rewrote `pytest-suite.yml` in place (`tasks.md` 5.6) and
# kept its depth-1 checkout. In `pytest-suite`'s depth-1 run the test's
# real-repository seat SKIPS LOUDLY and names this workflow; the
# throwaway-repository tests run in both.
#
# The job id is the TOKEN THAT NAMES THE FUNCTION, like `wallet-validation`, and
# the job carries no display name on purpose, so the status check surfaces as
# exactly `carve-manifest`.
#
# THE DEPENDENCY LINE IS PINNED AND WHEEL-ONLY. Each package is pinned to the
# exact version this check was verified with (PyYAML 6.0.3, jsonschema 4.26.0,
# rfc3339-validator 0.1.4, pytest 9.1.1), and `--only-binary :all:` refuses any
# source distribution, so no `setup.py` runs at install. Verified on 2026-10-08
# in a fresh Python 3.12 environment: the pinned line and all ten of its
# transitive dependencies install as wheels. Transitive versions are resolved
# by pip, not locked here. `wallet-validation.yml` and `pytest-suite.yml` are
# carved rows of the manifest, kept here; the adapter rebuild rewrote both
# (`tasks.md` 5.6), which `phase: post-shed` allows, and both now carry this
# pinned, wheel-only line (`wallet-validation.yml` without pytest).
#
# THE WORKFLOW REPORTS; IT DOES NOT BLOCK. Making `carve-manifest` a REQUIRED
# status check is Brett Heap's console act on the ruleset, as it was for
# `openspec-cli-pin` (docs/openspec-cli-pin.md, "Making the check required"),
# and a check is not selectable until it has reported once.
name: carve-manifest

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  carve-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Quoted: `:all: ` would otherwise read as a YAML mapping key.
      - run: "pip install --only-binary :all: pyyaml==6.0.3 jsonschema==4.26.0 rfc3339-validator==0.1.4 pytest==9.1.1"

      - run: python3 scripts/validate-carve-manifest.py

      - run: python3 -m pytest tests/carve_manifest -q
