# The offline test suite for every pull request to main. REQUIRED on this
# repository's default branch by the same ruleset as wallet-validation.
#
# The job carries no display name on purpose, for the same reason
# wallet-validation.yml does: the status check must surface as exactly
# `pytest-suite`, the literal token openXwallet's ruleset pins. A distinct job
# display name silently de-advises the gate.
#
# `-q` keeps the log readable but the SUMMARY LINE is the evidence: a suite that
# collected zero tests and a suite that passed are both "green" to a ruleset, so
# the collected count is what distinguishes them.
#
# HISTORY. At wallet-v1.0 this file ran the syntax gate's tests carried by that
# carve (tests/wallet_yaml_syntax_gate/). The openWallet carve took it to
# openWallet's code leg verbatim, with the standard's suites, which run there
# now (docs/openwallet-carve-manifest.yaml: `moved_verbatim`,
# `retained_here: kept`). The adapter rebuild rewrote the copy kept here
# (split-openwallet-neutral-core tasks.md 5.6); under the carve manifest's
# `phase: post-shed` a kept row is not compared with the carve, so the rewrite
# does not refuse there. It runs the suites this repository keeps (README.md,
# "What is here").
#
# THE SAME TWO SCOPED INIT LINES AS wallet-validation, BEFORE THE SUITE, because
# the kept suites drive the composed entrypoint, and the entrypoint loads its
# core from openWallet/code/scripts/validate-openxwallet.py (RULED Q1;
# design.md D5). Without the code leg it refuses, exit 2, and the suite would
# test nothing of the adapter. The root first, then its code leg, never
# `--recursive` and never the spec leg, which nothing here reads (design.md D6,
# "Init is scoped"). Both repositories are PUBLIC (RULED Q5), so the default
# token clones them and the job needs no secret.
#
# Issue #73 source jobs fetch full history so the real carve-history test
# executes in both full runs. The independent carve-manifest gate is retained.
#
# THE DEPENDENCY LINE IS PINNED AND WHEEL-ONLY: carve-manifest.yml's line. Each
# package is pinned to the exact version verified there on 2026-10-08 in a
# fresh Python 3.12 environment, and `--only-binary :all:` refuses any source
# distribution, so no `setup.py` runs at install.
name: pytest-suite

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest-suite:
    runs-on: ubuntu-latest
    # Full + mandatory native measured 4053.824s (67m34s) at the T012U source.
    # 90m is a bounded source-CI cap with ~25% headroom, not a runtime lease.
    # Bound both plus bootstrap/headroom; a timeout is not a test verdict.
    timeout-minutes: 90
    steps:
      - name: Require main for manual source validation
        id: manual-main-guard
        env:
          VALIDATION_EVENT: ${{ github.event_name }}
          VALIDATION_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$VALIDATION_EVENT" = "workflow_dispatch" ] && [ "$VALIDATION_REF" != "refs/heads/main" ]; then
            echo "::error::Manual source validation requires refs/heads/main."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Quoted: `:all: ` would otherwise read as a YAML mapping key.
      - name: Install complete reviewed wheel closure
        run: "pip install --only-binary :all: --require-hashes -r requirements-workload-binding.lock"

      - name: Install separate hash-pinned coverage tooling
        run: "pip install --only-binary :all: --require-hashes -r requirements/sonar-analysis.lock"

      - name: Enable startup tracing in this ephemeral CI Python only
        run: |
          python3 - <<'PYCODE'
          import site
          from pathlib import Path
          Path(site.getsitepackages()[0], "wallet_sonar_startup.pth").write_text(
              "import coverage; coverage.process_startup()\n")
          PYCODE

      - name: Initialize the openWallet root (scoped, never --recursive)
        run: git submodule update --init openWallet

      - name: Initialize the openWallet code leg (never the spec leg)
        run: git -C openWallet submodule update --init code

      # Analysis only: this complete-assembly project already scans the spec leg.
      - name: Initialize the spec leg for complete-source analysis only
        run: git -C openWallet submodule update --init spec

      - name: Select exact accepted owning wallet source for isolated integration
        shell: bash
        run: |
          git init "$RUNNER_TEMP/wallet-binding-owner"
          git -C "$RUNNER_TEMP/wallet-binding-owner" remote add origin https://github.com/opensoft/openWallet-code.git
          git -C "$RUNNER_TEMP/wallet-binding-owner" fetch --depth 1 origin bb0e9dae89a771b05f6c235d0a77237288b95c85
          git -C "$RUNNER_TEMP/wallet-binding-owner" checkout --detach FETCH_HEAD

      - name: Verify coverage evidence and prepare a fresh exact-source measurement
        run: |
          python3 -m pytest tests/sonar_quality/test_coverage_evidence.py -q
          python3 scripts/validate-sonar-coverage.py prepare

      - name: Run offline suite including explicit owning-source qualification
        env:
          WALLET_BINDING_OWNER_CODE: ${{ runner.temp }}/wallet-binding-owner
        # Source-test process only: do not grant a worker the runner's ambient
        # sudo/docker groups. The runtime correctly refuses unselected groups.
        shell: bash
        run: |
          TMPDIR="$(mktemp -d /var/tmp/xw.XXXXXX)"
          export TMPDIR
          # sudo's initial secure loader strips TMPDIR before its preserve list.
          # Pass this fresh, task-owned path after sudo starts.
          sudo --preserve-env=WALLET_BINDING_OWNER_CODE,HOME,PATH \
            env WALLET_SOURCE_MEASUREMENT=runtime TMPDIR="$TMPDIR" setpriv --reuid "$(id -u)" --regid "$(id -g)" \
              --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
              --no-new-privs \
              "$(command -v python3)" -m pytest tests/ -q -rs --junitxml=pytest-report.xml

      # Source checkout/install above may use the network. The required matrix
      # itself has loopback only, including fork/exec and isolated Python helpers.
      # Root only prepares this new namespace and drops every privilege before
      # pytest. This is ordinary source conformance, not protected pilot dispatch.
      - name: Required offline runtime conformance (zero missing or skipped cases)
        env:
          WALLET_BINDING_OWNER_CODE: ${{ runner.temp }}/wallet-binding-owner
        shell: bash
        run: |
          matrix_root="$(mktemp -d "$RUNNER_TEMP/runtime-conformance.XXXXXX")"
          chmod 700 "$matrix_root"
          sudo unshare --net -- /usr/bin/python3 -I -S tests/runtime_binding/isolation.py \
            --uid "$(id -u)" --python "$(command -v python3)" \
            --temp-root "$matrix_root" --owner-code "$WALLET_BINDING_OWNER_CODE"
          # Preserve the original audited native report with this source run.
          cp "$matrix_root/matrix.xml" .coverage-reports/native-matrix.xml


      - name: Verify the exact source stayed unchanged
        run: python3 scripts/validate-sonar-coverage.py verify-source

      - name: Retain the complete suite report with raw coverage
        run: cp pytest-report.xml .coverage-reports/pytest-report.xml

      - name: Publish same-run source and coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallet-sonar-runtime
          path: .coverage-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  coverage-tests:
    runs-on: ubuntu-latest
    # Measure the fixed main partition; the isolated job supplies its one
    # complementary case. The verifier requires the entire assertion union.
    timeout-minutes: 90
    steps:
      - name: Require main for manual source validation
        id: manual-main-guard
        env:
          VALIDATION_EVENT: ${{ github.event_name }}
          VALIDATION_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$VALIDATION_EVENT" = "workflow_dispatch" ] && [ "$VALIDATION_REF" != "refs/heads/main" ]; then
            echo "::error::Manual source validation requires refs/heads/main."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Quoted: `:all: ` would otherwise read as a YAML mapping key.
      - name: Install complete reviewed wheel closure
        run: "pip install --only-binary :all: --require-hashes -r requirements-workload-binding.lock"

      - name: Install separate hash-pinned coverage tooling
        run: "pip install --only-binary :all: --require-hashes -r requirements/sonar-analysis.lock"

      - name: Enable startup tracing in this ephemeral CI Python only
        run: |
          python3 - <<'PYCODE'
          import site
          from pathlib import Path
          Path(site.getsitepackages()[0], "wallet_sonar_startup.pth").write_text(
              "import coverage; coverage.process_startup()\n")
          PYCODE

      - name: Initialize the openWallet root (scoped, never --recursive)
        run: git submodule update --init openWallet

      - name: Initialize the openWallet code leg (never the spec leg)
        run: git -C openWallet submodule update --init code

      # Analysis only: this complete-assembly project already scans the spec leg.
      - name: Initialize the spec leg for complete-source analysis only
        run: git -C openWallet submodule update --init spec

      - name: Select exact accepted owning wallet source for isolated integration
        shell: bash
        run: |
          git init "$RUNNER_TEMP/wallet-binding-owner"
          git -C "$RUNNER_TEMP/wallet-binding-owner" remote add origin https://github.com/opensoft/openWallet-code.git
          git -C "$RUNNER_TEMP/wallet-binding-owner" fetch --depth 1 origin bb0e9dae89a771b05f6c235d0a77237288b95c85
          git -C "$RUNNER_TEMP/wallet-binding-owner" checkout --detach FETCH_HEAD

      - name: Verify coverage evidence and prepare a fresh exact-source measurement
        run: |
          python3 -m pytest tests/sonar_quality/test_coverage_evidence.py -q
          python3 scripts/validate-sonar-coverage.py prepare

      - name: Measure the fixed main partition after complete collection
        env:
          COVERAGE_CORE: ctrace
          WALLET_BINDING_OWNER_CODE: ${{ runner.temp }}/wallet-binding-owner
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
          COVERAGE_ROOT: ${{ github.workspace }}
          COVERAGE_FILE: ${{ github.workspace }}/.coverage-reports/.coverage
        # Source-test process only: do not grant a worker the runner's ambient
        # sudo/docker groups. The runtime correctly refuses unselected groups.
        shell: bash
        run: |
          TMPDIR="$(mktemp -d /var/tmp/xw.XXXXXX)"
          export TMPDIR
          # sudo's initial secure loader strips TMPDIR before its preserve list.
          # Pass this fresh, task-owned path after sudo starts.
          WALLET_SOURCE_MEASUREMENT=coverage python3 scripts/validate-sonar-coverage.py core
          sudo --preserve-env=WALLET_BINDING_OWNER_CODE,HOME,PATH,COVERAGE_PROCESS_START,COVERAGE_ROOT,COVERAGE_FILE \
            env COVERAGE_CORE=ctrace WALLET_SOURCE_MEASUREMENT=coverage TMPDIR="$TMPDIR" setpriv --reuid "$(id -u)" --regid "$(id -g)" \
              --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
              --no-new-privs \
              "$(command -v python3)" -m pytest tests/ -q -rs --junitxml=pytest-report.xml

      - name: Verify the exact source stayed unchanged
        run: python3 scripts/validate-sonar-coverage.py verify-source

      - name: Retain the complete suite report with raw coverage
        run: cp pytest-report.xml .coverage-reports/measured-pytest.xml

      - name: Publish same-run source and coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallet-sonar-primary
          path: .coverage-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  isolated-coverage:
    runs-on: ubuntu-latest
    # Fixed complementary measurement of the single CTracer-sensitive case.
    # The unchanged 3.12 full/native run remains separately required.
    timeout-minutes: 45
    steps:
      - name: Require main for manual source validation
        id: manual-main-guard
        env:
          VALIDATION_EVENT: ${{ github.event_name }}
          VALIDATION_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$VALIDATION_EVENT" = "workflow_dispatch" ] && [ "$VALIDATION_REF" != "refs/heads/main" ]; then
            echo "::error::Manual source validation requires refs/heads/main."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      # Quoted: `:all: ` would otherwise read as a YAML mapping key.
      - name: Install complete reviewed wheel closure
        run: "pip install --only-binary :all: --require-hashes -r requirements/coverage-workload.lock"

      - name: Install separate hash-pinned coverage tooling
        run: "pip install --only-binary :all: --require-hashes -r requirements/sonar-analysis.lock"

      - name: Enable startup tracing in this ephemeral CI Python only
        run: |
          python3 - <<'PYCODE'
          import site
          from pathlib import Path
          Path(site.getsitepackages()[0], "wallet_sonar_startup.pth").write_text(
              "import coverage; coverage.process_startup()\n")
          PYCODE

      - name: Initialize the openWallet root (scoped, never --recursive)
        run: git submodule update --init openWallet

      - name: Initialize the openWallet code leg (never the spec leg)
        run: git -C openWallet submodule update --init code

      # Analysis only: this complete-assembly project already scans the spec leg.
      - name: Initialize the spec leg for complete-source analysis only
        run: git -C openWallet submodule update --init spec

      - name: Select exact accepted owning wallet source for isolated integration
        shell: bash
        run: |
          git init "$RUNNER_TEMP/wallet-binding-owner"
          git -C "$RUNNER_TEMP/wallet-binding-owner" remote add origin https://github.com/opensoft/openWallet-code.git
          git -C "$RUNNER_TEMP/wallet-binding-owner" fetch --depth 1 origin bb0e9dae89a771b05f6c235d0a77237288b95c85
          git -C "$RUNNER_TEMP/wallet-binding-owner" checkout --detach FETCH_HEAD

      - name: Verify coverage evidence and prepare a fresh exact-source measurement
        run: |
          python3 -m pytest tests/sonar_quality/test_coverage_evidence.py -q
          python3 scripts/validate-sonar-coverage.py prepare

      - name: Measure the fixed isolated case after complete collection
        env:
          COVERAGE_CORE: sysmon
          WALLET_BINDING_OWNER_CODE: ${{ runner.temp }}/wallet-binding-owner
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
          COVERAGE_ROOT: ${{ github.workspace }}
          COVERAGE_FILE: ${{ github.workspace }}/.coverage-reports/.coverage
        # Source-test process only: do not grant a worker the runner's ambient
        # sudo/docker groups. The runtime correctly refuses unselected groups.
        shell: bash
        run: |
          TMPDIR="$(mktemp -d /var/tmp/xw.XXXXXX)"
          export TMPDIR
          # sudo's initial secure loader strips TMPDIR before its preserve list.
          # Pass this fresh, task-owned path after sudo starts.
          WALLET_SOURCE_MEASUREMENT=isolated python3 scripts/validate-sonar-coverage.py core
          sudo --preserve-env=WALLET_BINDING_OWNER_CODE,HOME,PATH,COVERAGE_PROCESS_START,COVERAGE_ROOT,COVERAGE_FILE \
            env COVERAGE_CORE=sysmon WALLET_SOURCE_MEASUREMENT=isolated TMPDIR="$TMPDIR" setpriv --reuid "$(id -u)" --regid "$(id -g)" \
              --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
              --no-new-privs \
              "$(command -v python3)" -m pytest tests/ -q -rs --junitxml=pytest-report.xml

      - name: Verify the exact source stayed unchanged
        run: python3 scripts/validate-sonar-coverage.py verify-source

      - name: Retain the complete suite report with raw coverage
        run: cp pytest-report.xml .coverage-reports/measured-pytest.xml

      - name: Publish same-run source and coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallet-sonar-isolated
          path: .coverage-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  source-conformance:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install the shell required by the complete provider corpus
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
          test -x /bin/zsh
          /bin/zsh --version
      - name: Install reviewed source-test and analysis dependencies
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-workload-binding.lock -r requirements/sonar-analysis.lock
          python3 -m venv "$RUNNER_TEMP/shape-analysis"
          "$RUNNER_TEMP/shape-analysis/bin/pip" install --only-binary :all: --require-hashes -r requirements/analysis-shape.lock -r requirements/sonar-analysis.lock
      - name: Enable startup tracing in both ephemeral CI interpreters
        run: |
          for python in "$(command -v python3)" "$RUNNER_TEMP/shape-analysis/bin/python"; do
            "$python" - <<'PYCODE'
          import site
          from pathlib import Path
          Path(site.getsitepackages()[0], "wallet_sonar_startup.pth").write_text(
              "import coverage; coverage.process_startup()\n")
          PYCODE
          done
      - name: Initialize the exact complete analysis assembly
        run: |
          git submodule update --init openWallet
          git -C openWallet submodule update --init code spec
      - name: Fetch immutable admitted conformance providers
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess
          from pathlib import Path
          records = json.loads(Path("requirements/analysis-providers.json").read_text())
          for role, repository in (("openspec", "opensoft/openXfactory"), ("shape", "opensoft/openRepoShape")):
              row = records[role]
              assert row["repository"] == repository and row["main_admission"] == "verified"
              assert all(re.fullmatch("[0-9a-f]{40}", row[key]) for key in ("commit", "admitted_main"))
              target = Path(os.environ["RUNNER_TEMP"]) / ("wallet-analysis-" + role)
              def git(*args):
                  subprocess.run(["git", "-C", str(target), *args], check=True)
              target.mkdir(mode=0o700)
              git("init")
              git("remote", "add", "origin", "https://github.com/" + repository + ".git")
              # Full provider history also runs the existing historical probes.
              git("fetch", "--no-tags", "origin", "main")
              git("merge-base", "--is-ancestor", row["admitted_main"], "refs/remotes/origin/main")
              git("checkout", "--detach", row["commit"])
          PYCODE
      - name: Select the unchanged accepted owning source for import conformance
        run: |
          git init "$RUNNER_TEMP/wallet-binding-owner"
          git -C "$RUNNER_TEMP/wallet-binding-owner" remote add origin https://github.com/opensoft/openWallet-code.git
          git -C "$RUNNER_TEMP/wallet-binding-owner" fetch --depth 1 origin bb0e9dae89a771b05f6c235d0a77237288b95c85
          git -C "$RUNNER_TEMP/wallet-binding-owner" checkout --detach FETCH_HEAD
      - name: Prepare a fresh same-source measurement
        run: python3 scripts/validate-sonar-coverage.py prepare
      - name: Run owning-leg tests and immutable provider conformance on actual copies
        env:
          WALLET_BINDING_OWNER_CODE: ${{ runner.temp }}/wallet-binding-owner
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
          COVERAGE_ROOT: ${{ github.workspace }}
          COVERAGE_FILE: ${{ github.workspace }}/.coverage-reports/.coverage
          WALLET_ANALYSIS_PROVIDER_ROOT: ${{ runner.temp }}/wallet-analysis-openspec
          WALLET_ANALYSIS_SHAPE_ROOT: ${{ runner.temp }}/wallet-analysis-shape
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d /var/tmp/xw.XXXXXX)"
          export TMPDIR
          reports="$PWD/.coverage-reports"
          # Additional real 3.12 imports cover eager annotations without running
          # timed cases under CTracer. Both full suites still execute every case.
          python3 -c 'import coverage,sys; assert sys.version_info[:2] == (3,12); assert dict(coverage.Coverage.current().sys_info())["core"] == "CTracer"'
          python3 -m pytest tests/ --collect-only -q > "$reports/import-collection.txt"
          (cd openWallet/code && python3 -m pytest tests/ -q -rs --junitxml="$reports/code-pytest.xml")
          (cd openWallet/spec && python3 -m pytest tests/ -q -rs --junitxml="$reports/spec-pytest.xml")
          python3 scripts/validate-openspec-cli-pin.py --all --no-cache --tarball tools/openspec-cli-pin/fission-ai-openspec-1.12.0-c844543999f673cdd72445879b86a4abea4c07ef.tgz
          (cd openWallet/spec && python3 scripts/validate-openspec-cli-pin.py --all --no-cache --tarball tools/openspec-cli-pin/fission-ai-openspec-1.12.0-c844543999f673cdd72445879b86a4abea4c07ef.tgz)
          python3 scripts/run-provider-conformance.py openspec-adapter
          python3 scripts/run-provider-conformance.py openspec-spec
          PATH="$RUNNER_TEMP/shape-analysis/bin:$PATH" "$RUNNER_TEMP/shape-analysis/bin/python" scripts/run-provider-conformance.py shape
      - name: Verify the source remained identical throughout the auxiliary run
        run: python3 scripts/validate-sonar-coverage.py verify-source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallet-sonar-auxiliary
          path: .coverage-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  sonar-analysis:
    needs: [pytest-suite, coverage-tests, isolated-coverage, source-conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No analysis credential is available to the test process or its children.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: analysis-python
        with:
          python-version: "3.14"
      - name: Initialize the exact complete analysis assembly
        run: |
          git submodule update --init openWallet
          git -C openWallet submodule update --init code spec
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wallet-sonar-primary
          path: .coverage-reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wallet-sonar-auxiliary
          path: .coverage-reports/auxiliary
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wallet-sonar-runtime
          path: .coverage-reports/runtime
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wallet-sonar-isolated
          path: .coverage-reports/isolated
      - name: Install hash-pinned evidence reader
        run: "pip install --only-binary :all: --require-hashes -r requirements/sonar-analysis.lock"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: runtime-python
        with:
          python-version: "3.12"
      - name: Install independent target-runtime evidence reader
        run: "pip install --only-binary :all: --require-hashes -r requirements/sonar-analysis.lock"
      - name: Verify real cross-version coverage identities and zero-hit preservation
        env:
          WALLET_PROBE_PYTHON312: ${{ steps.runtime-python.outputs.python-path }}
          WALLET_PROBE_PYTHON314: ${{ steps.analysis-python.outputs.python-path }}
        run: python3 tests/sonar_quality/cross_version_probe.py
      - name: Combine real same-source runs and audit both interpreter denominators
        env:
          ANALYSIS_PYTHON: ${{ steps.analysis-python.outputs.python-path }}
          WALLET_TARGET_PYTHON: ${{ steps.runtime-python.outputs.python-path }}
        run: |
          python3 scripts/validate-sonar-coverage.py assemble
          python3 scripts/validate-sonar-coverage.py check
          "$ANALYSIS_PYTHON" scripts/validate-sonar-coverage.py check
      - name: Retain the complete verified coverage before credentialed analysis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallet-sonar-complete
          path: .coverage-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Analyze complete source and wait for the existing quality gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: .
          skipSignatureVerification: "false"
      - name: Verify evaluated gate, retained baseline and exact main source
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/validate-sonar-coverage.py gate
      - name: Publish evaluated gate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallet-sonar-gate
          path: .coverage-reports/gate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
