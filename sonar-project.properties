# Complete assembly, retaining the existing project, profiles and gate.
sonar.projectKey=opensoft_openXwallet
sonar.organization=opensoft
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**,**/tests/**,**/conftest.py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=.coverage-reports/coverage.xml
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
# Preserve all default generic secret patterns and include tracked contract/config
# formats throughout initialized legs; clean noncode files may be absent from UI.
sonar.text.inclusions.activate=true
sonar.text.inclusions=**/*.sh,**/*.bash,**/*.zsh,**/*.ksh,**/*.ps1,**/*.properties,**/*.conf,**/*.pem,**/*.config,**/*.env,.aws/config,**/*.key,**/*.yaml,**/*.yml,**/*.toml,**/*.json
