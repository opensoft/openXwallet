# VALID wallet record declaring a KEY SET: one holder, one authority, several
# keys that may present it (add-multi-key-wallets, ratified 2026-08-28). The
# wallet is identified by the SET — `key_reference` plus every `keys:` entry —
# and every key in it is a key THIS holder holds, which is why declaring several
# is still not a record of someone else's key.
#
# MIXED CUSTODY IS THE POINT. The wallet declares
# `isolated_per_use_authorized`, so its issuance ceiling is
# `act_unsupervised`. Its additional keys declare WEAKER custody, and that is
# legal and expected: a key may be weaker than its wallet, and what a weak key
# may exercise is capped at USE rather than by refusing the declaration. The
# reverse is refused — see negative/wallet-declared-key-outranks-its-wallet.yaml.
#
# The public halves here are FIXTURE VALUES derived deterministically from this
# file's own labels. They are 32-byte strings in `did:key`'s encoding so the
# fingerprint check has something real to recompute; nobody holds a private
# half for any of them, and no live surface references them.
