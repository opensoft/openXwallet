# VALID exercise presented by a NON-PRIMARY declared key. Three things are
# working here that could not be expressed before the key set existed:
#
#   the audience binding resolves the presenting key through the wallet's
#   DECLARED SET rather than its primary key alone;
#
#   `custody_model_in_force` is the custody of THE KEY THAT SIGNED —
#   `holder_readable`, seat A's own declaration — and not the wallet's
#   `isolated_per_use_authorized`. An audit reader can therefore tell that the
#   ENVIRONMENT was evidenced, which is the truth about this signature;
#
#   the grant's tier (`act`) is within that key's ceiling (`act`), so the
#   per-key cap admits it.
