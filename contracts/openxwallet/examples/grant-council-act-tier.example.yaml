# VALID grant to a MULTI-KEY wallet. Authority is addressed to the WALLET, never
# to one of its keys: the audience shape admits `wallet_ref` and `holder_ref`
# and nothing else, which is how "grants stay wallet-level" is enforced by shape
# rather than by rule. Any key of the audience wallet may present this grant,
# and what each key's signature EVIDENCES is then that key's own custody.
