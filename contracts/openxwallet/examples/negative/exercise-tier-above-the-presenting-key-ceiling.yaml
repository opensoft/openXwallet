# expected_failure: presenting-key-evidence-cap
# expected_failure_detail: not a grant every one of its keys may exercise
# requirement: OXW-R4
# VIOLATES core R4: a grant exercised by a key whose custody cannot evidence
# what that tier requires.
#
# Everything upstream is in order, which is the point. `grant-council-`
# `unsupervised-0012` is an ADMISSIBLE grant: its audience wallet declares
# `isolated_per_use_authorized`, whose ceiling is `act_unsupervised`, so rule
# (e) admits it at issuance — and rule (e) is the only cap issuance can apply,
# because issuance cannot know which of the wallet's keys will sign.
#
# Then seat A signs it. Seat A declares `holder_readable`: its signature
# evidences that the ENVIRONMENT acted, ceiling `act`. `act_unsupervised` is the
# tier where nothing stands between the holder and an irreversible external
# effect, which is exactly the tier that requires evidence the HOLDER acted.
#
# So a grant a wallet may HOLD is not a grant every one of its keys may
# EXERCISE, and without this cap the custody ladder is silently re-flattened by
# whichever key happened to be reachable. Note what is NOT refused: a record
# documenting this same event as `refused` with the exercise contract's own
# `custody_ceiling_exceeded` code is the correct, valid record.
