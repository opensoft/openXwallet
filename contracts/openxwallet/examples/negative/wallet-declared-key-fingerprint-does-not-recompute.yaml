# expected_failure: declared-key-fingerprint-mismatch
# expected_failure_detail: two claims about ONE key and cannot both be true
# requirement: OXW-R1
# VIOLATES core R1: a declared key whose fingerprint contradicts its own
# public half.
#
# The fingerprint has ONE spelling across this family — `"sha256:" +
# sha256(raw 32-byte public key).hexdigest()` — computed the same way by the
# mint record that produces a key, by the review-authority register reader, and
# by the Hermes runtime. It exists so a key declared on one governed surface can
# be shown to be the same key recorded on another.
#
# A fingerprint nothing recomputes is decoration. Here the entry carries its own
# public half, so there is nothing to trust: the value either recomputes or it
# does not. This one is another fixture key's fingerprint — legal shape, wrong
# key, which is precisely the transcription slip a join token has to catch.
