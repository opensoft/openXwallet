# expected_failure: revoked-chain-exercised
# expected_failure_detail: a retired key presents nothing
# requirement: OXW-R6
# VIOLATES core R6: an exercise permitted under a declared key whose
# declaration records it as retired.
#
# `key-council-retired-0011` is still DECLARED, and deliberately so: deleting a
# retired key's declaration would retroactively invalidate every already-
# recorded exercise that named it, because this validator re-adjudicates every
# family-kind file in a scanned tree on every run. A rotation must not rewrite
# the verdict on committed history. So the declaration is append-only and the
# STATE is what moves.
#
# Which means the refusal has to happen at USE, and it is the same rule that
# refuses a revoked grant or a suspended wallet — issuance-time validity is not
# evidence of current validity — so it reports under the same code rather than
# acquiring a second name for one rule.
#
# What is NOT refused: the wallet's own standing is `active` and its other keys
# keep presenting its authority. Retiring one of several keys must not park the
# rest, or rotation becomes an outage.
