# expected_failure: schema
# expected_failure_detail: 'custody' is a required property
# requirement: OXW-R4
# VIOLATES core R4: a declared key with no custody declaration.
#
# Custody is what bounds what a signature EVIDENCES, so a declared key without
# one is a key whose signature evidences nothing anybody wrote down — and every
# ceiling computed from it resolves to nothing, which is the cap failing open at
# the point it is supposed to bind. Required in the shape rather than checked by
# a rule, because an absent declaration is not a disagreement to adjudicate; it
# is a missing field.
#
# The detail pin matters here: without it this fixture would pass on ANY schema
# finding, including a typo somewhere else in the file, and would stop testing
# the invariant it is named for.
