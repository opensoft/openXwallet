# expected_failure: declared-key-raises-authority
# expected_failure_detail: never a source of more of it
# requirement: OXW-R4
# VIOLATES core R4: a declared key claiming a custody ceiling above its
# wallet's own.
#
# The wallet declares `holder_readable` — ceiling `act`, evidencing the
# ENVIRONMENT — and then declares a key under `isolated_per_use_authorized`,
# ceiling `act_unsupervised`. Read charitably it says "this wallet has a strong
# key too". Read as a machine reads it, the wallet's declared ceiling stops
# being a fact about the RECORD and becomes a fact about the primary key only,
# so every consumer that reads a wallet's custody to decide what it may be
# granted is reading a partial answer.
#
# Keys are PRESENTERS of a wallet's single authority and never sources of more
# of it. Raising authority stays a question about the wallet's custody, and the
# refusal is keyed on RANK rather than on the tier's name — a registry that
# renamed its top tier must not be able to slip past this.
