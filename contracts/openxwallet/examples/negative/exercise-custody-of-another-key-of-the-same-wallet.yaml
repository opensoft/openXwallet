# expected_failure: custody-model-mismatch
# expected_failure_detail: presenting key 'key-council-seat-a-0011'
# requirement: OXW-R4
# VIOLATES core R4: an exercise recording the custody of a DIFFERENT key of the
# same wallet as the custody in force.
#
# The presenting key is seat A, which declares `holder_readable` — a signature
# under it evidences that the ENVIRONMENT acted. The record claims
# `isolated_invocable`, which is seat B's declaration and is also a real member
# of this same wallet's key set. So the record is not naming a model nobody
# declared; it is naming a model the wallet does declare, for a key that did not
# sign.
#
# That is the failure a wallet-level basis could not see. Before the key set
# existed, the comparison was against THE WALLET's single declaration, and a
# multi-key wallet checked that way would accept any of its own keys' custody on
# any of its exercises — the audit line "the record carries the custody model in
# force at the time" reduced to "some custody this wallet has somewhere".
#
# `isolated_invocable` and `holder_readable` even share a ceiling, so nothing
# downstream would notice. The two differ in BLAST RADIUS, not in authority, and
# an audit reader is entitled to the true one.
