schema_version: 1
kind: contract_manifest

# ============================================================================
# openXwallet contract manifest — the neutral wallet standard's own bundle.
#
# openXwallet was carved out of openxFactory as a BYTE-IDENTICAL PURE MOVE, so
# every `sha256:` on an owned row below is the value openxFactory recorded at
# the NAMED CARVE COMMIT, unchanged. That is not a courtesy: a move whose diff
# is not provably empty cannot be bisected against, and openxFactory's atomic
# consume-and-shed rests on exactly that property. The proof lives in
# docs/byte-identity-wallet-v1.0.md.
#
# The ONLY field rewritten from openxFactory's rows is `source_path:`, which
# names the repository a consumer vendors FROM -- and that repository changed.
# Machine keys do NOT move in v1 (R2, LOCKED): paths, ids, the
# `xfactory_wallet_*` kind prefix, finding codes and filenames are unchanged,
# because LedgerxFactory pins five kinds and several finding-code strings by
# name and a rename inside the move is unbisectable.
#
# `adapter_owner: openxFactory` is likewise carried verbatim on owned rows: it
# records who owns the adapter obligation for this contract class in the
# family's history, and rewriting it would be a rename inside a move whose
# safety rests on an empty diff. It is revisited by a later change in this
# repository, never by the carve.
# ============================================================================

contract_bundle_version: wallet-v1.0

# The machine-read one of THREE provenance records for the carve. The other two
# are `carve_commit:` in openxFactory's contracts/openxwallet-pin.yaml (at P3)
# and the procedure in docs/openxwallet-cutover-runbook.md. There is
# deliberately NO bare CARVE_COMMIT file: an unschema'd file nothing reads is
# the failure class of a governance floor whose source of truth is loose
# markdown.
carved_from:
  repository: opensoft/openxFactory
  commit: 30565e48ffe3d8a9773e10af33425701845e10f6

# ---------------------------------------------------------------------------
# RELEASE-SURFACE SELECTION RULE, declared rather than inferred.
#
#   wallet-vN.M.digests.yaml  selects  { row | row.member_class == "owned" }
#
# Exclusion is by DECLARED FIELD, never by a `contracts/schemas/` path
# heuristic -- that heuristic breaks the day openXwallet publishes a schema of
# its OWN there. A row with no `member_class:` is OWNED (the eight below); the
# one consumed member declares itself.
# ---------------------------------------------------------------------------

