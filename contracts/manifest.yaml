  # ---- CONSUMED member: the one openxFactory artifact openXwallet vendors ----
  # openXwallet owns the wallet standard. It vendors exactly one thing it did
  # not write, and this row is how that is said without lying in either
  # direction.
  #
  # `shared-contract-ownership:142` requires all publisher markers TOGETHER, so
  # the file cannot simply be omitted; recording it as OWNED would falsely claim
  # an openxFactory contract. The third option -- a consumed member carrying the
  # publisher's nine fields plus three declared ones -- is the ratified one
  # (clarification N8).
  #
  # THE DIGEST IS COMPUTED, NOT COPIED. openxFactory's own manifest row for this
  # artifact carries NO `sha256:` at all: it is
  # `compatibility: copied_from_source_commit` with
  # `adapter_owner: Omnigent-Install`, content-addressed by commit from
  # opensoft/Omnigent-Install. So the digest below is recomputed over the pinned
  # bytes at the carve commit -- the digest of the pinned openxFactory artifact,
  # recomputed rather than transcribed. It equals contract_pin.yaml's recorded
  # value, so the verifier and this manifest cannot disagree.
  #
  # The upstream chain is two hops: Omnigent-Install -> openxFactory ->
  # openXwallet. `adapter_owner: openxFactory` names the hop openXwallet
  # actually pins, has a resync runbook for, and can verify against; naming
  # Omnigent-Install would describe a repository this pin cannot reach.
  #
  # THE PATH IS LOAD-BEARING: identical repository-relative path, so
  # ENVELOPE_SCHEMA_PATH (scripts/validate-openxwallet.py:218) and its
  # .relative_to(ROOT) print need no edit and the empty-diff proof survives.
  # Added by the SCAFFOLD commit, never by the carve.
  - id: hermes-job-envelope
    path: contracts/schemas/hermes-job-envelope.schema.yaml
    source_path: openxFactory/contracts/schemas/hermes-job-envelope.schema.yaml
    type: schema
    schema_version: 1
    sha256: 8ce2c89903a2f5a68ce3d73a7b8eb4f47cdef913da038b9a68e22735ee96cb7c
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The canonical Hermes job envelope, consumed READ-ONLY at a digest pin.
      scripts/validate-openxwallet.py rule (g) reads the approval-scope
      vocabulary out of this file, and main() checks only that it EXISTS --
      presence, not identity -- so scripts/verify-contract-pin.py verifies this
      digest as the FIRST step of the wallet-validation job, before the
      validator runs. Re-sync through docs/pin-resync-runbook.md; never edit
      this file in place.
    member_class: consumed
    release_surface: false
    pinned_openxfactory_bundle: contract-v1.44
