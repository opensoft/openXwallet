schema_version: 1
kind: contract_manifest

# ============================================================================
# openXwallet contract manifest — the openxFactory ADAPTER's own bundle.
#
# THIS REPOSITORY OWNS NO CONTRACT. Since `split-openwallet-neutral-core`
# (ratified 2026-10-08 by Brett Heap, "ratify 26 and merge"), the neutral wallet
# standard is openWallet's: the two contract families and the eight digested
# artifacts live in its CODE leg (`opensoft/openWallet-code`, RULED Q7), and
# their eight OWNED rows live in its ROOT's `contracts/manifest.yaml`
# (`opensoft/openWallet`, task 4.5), re-pathed to `code/contracts/…` with every
# sha256 unchanged. openXwallet is the adapter that pins that root and binds it
# to openxFactory.
#
# NO MIRROR COPIES (design.md D6). This manifest does not register the eight as
# owned, and it does not list them as consumed rows either: the ONE record here
# of which openWallet bytes this repository runs is `contracts/openwallet-pin.yaml`
# — the root commit, the code-leg commit held in lockstep with the root's own
# gitlink and `contracts/code-pin.yaml`, and the eight per-file sha256 at
# `code/contracts/…` — and `scripts/verify-openwallet-pin.py` verifies it before
# any gate runs. A consumed row here would be a SECOND digest for the same
# bytes, and two records that can disagree are no record. D6 left the choice to
# the plan; the plan took the pin file. So the manifest also claims nothing it
# does not own, which is what openxFactory's `shared-contract-ownership`
# publisher markers ask of a repository that still carries a manifest, a
# `contracts/schemas/` and a file named like the family validator (design.md
# Risks, "The publisher-marker test").
#
# What remains is ONE CONSUMED member, below: the hermes job envelope this
# repository vendors from openxFactory and binds as the pinned validator's
# approval vocabulary (design.md D4, RULED Q6).
#
# HISTORY, KEPT AS HISTORY. openXwallet was carved out of openxFactory as a
# BYTE-IDENTICAL PURE MOVE at `wallet-v1.0` (`carved_from:` below; the proof is
# docs/byte-identity-wallet-v1.0.md), and through `wallet-v1.5` this file
# carried the eight owned rows with the sha256 openxFactory recorded at that
# carve. The standard then left this repository by a second carve, at
# 90111df262d6f54f7e82651d860adc12345f83f4, declared row by row in
# docs/openwallet-carve-manifest.yaml, which also records this file's own
# arrival at the openWallet root and that it is `kept` here. Machine keys did
# not move in either carve: paths, ids, the `xfactory_wallet_*` kind prefix,
# finding codes and filenames are unchanged ("keep the prefix", 2026-10-08).
# ============================================================================

# contract_bundle_version — THE ADAPTER'S TAG VALUE. Two rulings by Brett Heap,
# labels verbatim: "Adapter series `xwallet-v*`, first `xwallet-v1.0`
# (Recommended)" names the adapter's OWN series and its first value, and "The
# adapter's tag value (Recommended)" says this field holds that tag's value.
# Task 5.8, Brett Heap's OPERATOR act, tags this change's merge commit
# `xwallet-v1.0`, with the other values of AGENTS.md rule 6. This manifest
# registers no owned row, so no per-file `contract_schema_version` moves with
# it; the per-file digests of the openWallet bytes the release runs live in
# `contracts/openwallet-pin.yaml`; and the `contracts/releases/` digest
# inventories were shed to the openWallet root by ruling (Q4's placement, the
# carve manifest's `retained_here: shed`). The `wallet-v*` series, whose last
# value here was `wallet-v1.5` (2026-09-06), continues at the openWallet ROOT
# (RULED Q4, "openWallet continues wallet-v* (Recommended)").
contract_bundle_version: xwallet-v1.0

# The machine-read one of THREE provenance records for the FIRST carve — the
# one that created this repository. The other two are `carve_commit:` in
# openxFactory's contracts/openxwallet-pin.yaml (at P3) and the procedure in
# docs/openxwallet-cutover-runbook.md. There is deliberately NO bare
# CARVE_COMMIT file: an unschema'd file nothing reads is the failure class of a
# governance floor whose source of truth is loose markdown.
#
# The SECOND carve, of openWallet OUT of this repository, is recorded where its
# readers look: `carve_commit:` in docs/openwallet-carve-manifest.yaml here,
# and `carved_from:` in the openWallet root's own manifest. This field is not
# rewritten for it: it says where THIS repository came from.
carved_from:
  repository: opensoft/openxFactory
  commit: 30565e48ffe3d8a9773e10af33425701845e10f6

# ---------------------------------------------------------------------------
# RELEASE-SURFACE SELECTION RULE, declared rather than inferred.
#
#   a release's digest inventory  selects  { row | row.member_class == "owned" }
#
# Exclusion is by DECLARED FIELD, never by a `contracts/schemas/` path
# heuristic -- that heuristic breaks the day a repository publishes a schema of
# its OWN there. A row with no `member_class:` is OWNED.
#
# Since the adapter rebuild there is NO owned row here, so this manifest's
# release surface holds no contract artifact. The `wallet-v1.0…v1.5` digest
# inventories (`contracts/releases/`) left with the eight they describe, to the
# openWallet root (carve manifest rows `retained_here: shed`). An owned row
# added here would be a contract this repository publishes, and that is a new
# boundary decision, through OpenSpec first (AGENTS.md).
# ---------------------------------------------------------------------------

contracts:
  # ---- CONSUMED member: the one openxFactory artifact openXwallet vendors ----
  # openXwallet owns no contract. It vendors exactly one thing it did not
  # write, and this row is how that is said without lying in either direction.
  #
  # `shared-contract-ownership:142` requires all publisher markers TOGETHER, so
  # the file cannot simply be omitted; recording it as OWNED would falsely claim
  # an openxFactory contract. The third option -- a consumed member carrying the
  # publisher's nine fields plus three declared ones -- is the ratified one
  # (clarification N8).
  #
  # THE DIGEST IS COMPUTED, NOT COPIED. openxFactory's own manifest row for this
  # artifact carries NO `sha256:` at all: it is
  # `compatibility: copied_from_source_commit` with
  # `adapter_owner: Omnigent-Install`, content-addressed by commit from
  # opensoft/Omnigent-Install. So the digest below is recomputed over the pinned
  # bytes at the carve commit -- the digest of the pinned openxFactory artifact,
  # recomputed rather than transcribed. It equals contract_pin.yaml's recorded
  # value, so the verifier and this manifest cannot disagree.
  #
  # The upstream chain is two hops: Omnigent-Install -> openxFactory ->
  # openXwallet. `adapter_owner: openxFactory` names the hop openXwallet
  # actually pins, has a resync runbook for, and can verify against; naming
  # Omnigent-Install would describe a repository this pin cannot reach.
  #
  # THE PATH IS LOAD-BEARING: the identical repository-relative path it holds in
  # openxFactory. At wallet-v1.0 that let the validator's ROOT-relative
  # `ENVELOPE_SCHEMA_PATH` and its `.relative_to(ROOT)` print go unedited, so
  # the empty-diff proof survived. Since the adapter rebuild the path is the
  # adapter's: it binds the vocabulary from this file relative to THIS
  # repository's root, and the vocabulary note prints the path byte for byte as
  # the pre-split validator did, which D5's neutrality gate holds. Added by the
  # wallet-v1.0 SCAFFOLD commit, never by a carve; it did not travel to
  # openWallet, which carries no openxFactory input (RULED Q6, design.md D4).
  - id: hermes-job-envelope
    path: contracts/schemas/hermes-job-envelope.schema.yaml
    source_path: openxFactory/contracts/schemas/hermes-job-envelope.schema.yaml
    type: schema
    schema_version: 1
    sha256: 8ce2c89903a2f5a68ce3d73a7b8eb4f47cdef913da038b9a68e22735ee96cb7c
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The canonical Hermes job envelope, consumed READ-ONLY at a digest pin.
      The adapter binds the pinned openWallet validator's rule (g) to the
      approval-scope vocabulary read out of this file, unconditionally, and
      never checks the file's identity -- so scripts/verify-contract-pin.py
      verifies this digest in the wallet-validation job before any gate reads
      it. Re-sync through
      docs/pin-resync-runbook.md; never edit this file in place.
    member_class: consumed
    release_surface: false
    pinned_openxfactory_bundle: contract-v1.44
