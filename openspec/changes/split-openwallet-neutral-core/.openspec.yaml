# `openxwallet-agent-profile`, so its archive RETIRES both capabilities.
# MEASURED on the pinned openspec 1.12.0, in a scratch copy, 2026-10-08:
# without this key the archive aborts ("To retire the capability and delete
# its spec, add `retire_capabilities: true` to the change's .openspec.yaml");
# with it, and with the promoted specs' wrapped scenario lines reflowed
# (tasks.md 2.2), the archive applies +5 / -11 and retires both specs.
retire_capabilities: true
