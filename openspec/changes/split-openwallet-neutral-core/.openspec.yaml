  reason: >-
    Brett Heap (openXwallet operator authority), in session on 2026-10-08,
    two statements, recorded verbatim. First: "consider if we make
    openWallet as a standalone neutral wallet system that does not need
    openXfactory. then we make openXwallet as the adapter layer for neutral
    contracts for openXfactory and then the actual wallets are the domain
    wallets like medXwallet and ledgerXwallet. this then matches our openDox
    project and openAvatar. we can keep all our projects able to run stand
    alone but tuned version that run with our xFactories." Then: "write the
    openspec proposal for the split, keep the prefix". The second statement
    commissions THIS packet and carries one ruling, which the packet encodes
    and does not re-open: the prefix is KEPT. Its scope, as relayed by the
    orchestrating session that took the ruling: the `xfactory_wallet_*` kind
    prefix, every finding code and the existing schema `$id` namespace are
    unchanged by the carve, and a rename to a neutral prefix stays deferred
    to a future wallet MAJOR. That answers Q3 carried by openxFactory's
    archived `split-openxwallet-repo`; this split's own shape answers that
    packet's Q1 as well (see proposal.md). Brett Heap then ruled the
    packet's six open questions, Q1-Q6, in session on 2026-10-08 by multiple
    choice, and Q3 overrode its recommendation; Q3's ruling raised Q7 and the
    spec leg's OpenSpec-gate question (tasks.md 3.6), which he ruled later the
    same day, also by multiple choice. All eight are listed under `rulings`,
    in two rounds, with their labels verbatim. Those rulings do NOT ratify the
    change: `approved_by` stays pending. Everything else in the packet — the
    carve procedure, the leg placement beyond the contracts, the validator
    split and the pin's field layout — is PROPOSED. The record of the
    statements and the rulings is this packet's proposal.md; no separate
    ruling file exists, and none is invented here.
